name: LowkeyCore
version: 0.4.0
main: nl.lowkey.core.LowkeyCore
api-version: '26.1'
description: LowkeySMP chat tags, join/leave messages, grace period and elimination effects
authors: [LowkeySMP]
commands:
  lowkey:
    description: LowkeySMP admin commando
    usage: /lowkey grace <speler> <minuten> | /lowkey team <speler> <noord|zuid|geen> | /lowkey nether <open|close>
permissions:
  lowkey.admin:
    description: Toegang tot /lowkey
    default: op
