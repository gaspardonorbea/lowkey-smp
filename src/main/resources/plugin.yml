name: LowkeyCore
version: 0.29.0
main: nl.lowkey.core.LowkeyCore
api-version: '26.1'
description: LowkeySMP chat tags, join/leave messages, grace period, elimination effects, server hours, donation broadcaster, lobby, server launch and the one and only mace
authors: [LowkeySMP]
commands:
  lowkey:
    description: LowkeySMP admin commando
    usage: /lowkey grace <speler> <minuten> | /lowkey graceall [minuten] | /lowkey team <speler> <noord|zuid|geen> | /lowkey crew <speler> <aan|uit> | /lowkey nether <open|close> | /lowkey server <open|close> | /lowkey border <open|close> | /lowkey revive <speler> | /lowkey donate | /lowkey website | /lowkey give <speler> | /lowkey seed <seed|random|cancel> | /lowkey login | /lowkey pin <pincode> | /lowkey launch [reset] | /lowkey lobby <create|tp|setspawn|delete|protect> | /lowkey setspawn <noord|zuid> | /lowkey main | /lowkey mainworld <open|close> | /lowkey countdown <spawn|remove|set|size> | /lowkey mace <status|aan|uit|cooldown|cooldownreset|give|reset|test> | /lowkey checklist | /lowkey event <start|test|stop|camera|teams|reset> | /lowkey losers <create|tp|setspawn|open|close|return|returnall|delete> | /lowkey end <open|close> | /lowkey menu <nieuw|klassiek> | /lowkey tijdlijn | /lowkey say <bericht>
permissions:
  lowkey.admin:
    description: Toegang tot /lowkey
    default: op
