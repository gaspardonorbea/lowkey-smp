name: LowkeyCore
version: 0.16.0
main: nl.lowkey.core.LowkeyCore
api-version: '26.1'
description: LowkeySMP chat tags, join/leave messages, grace period, elimination effects, server hours, donation broadcaster, lobby and server launch
authors: [LowkeySMP]
commands:
  lowkey:
    description: LowkeySMP admin commando
    usage: /lowkey grace <speler> <minuten> | /lowkey team <speler> <noord|zuid|geen> | /lowkey crew <speler> <aan|uit> | /lowkey nether <open|close> | /lowkey server <open|close> | /lowkey border <open|close> | /lowkey revive <speler> | /lowkey donate | /lowkey launch [reset] | /lowkey lobby <create|tp|setspawn|delete|protect> | /lowkey setspawn <noord|zuid> | /lowkey main | /lowkey mainworld <open|close> | /lowkey countdown <spawn|remove|set|size> | /lowkey say <bericht>
permissions:
  lowkey.admin:
    description: Toegang tot /lowkey
    default: op
