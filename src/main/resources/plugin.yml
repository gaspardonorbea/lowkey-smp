name: LowkeyCore
version: 0.11.0
main: nl.lowkey.core.LowkeyCore
api-version: '26.1'
description: LowkeySMP chat tags, join/leave messages, grace period, elimination effects, server hours and donation broadcaster
authors: [LowkeySMP]
commands:
  lowkey:
    description: LowkeySMP admin commando
    usage: /lowkey grace <speler> <minuten> | /lowkey team <speler> <noord|zuid|geen> | /lowkey nether <open|close> | /lowkey server <open|close> | /lowkey lobby <world|setspawn|setgamespawn|setloserspawn|teleport <speler> <main|loser>> | /lowkey border <open|close> | /lowkey revive <speler> | /lowkey donate
permissions:
  lowkey.admin:
    description: Toegang tot /lowkey
    default: op
